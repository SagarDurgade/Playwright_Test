name: Auto Playwright Tests

on:
  schedule:
    # Offset from :00 to avoid GitHub's top-of-the-hour scheduling congestion/drops
    # - cron: '7 4 * * *' # Daily at ~9:37 AM IST
    #  execute  tests at 12:05 pm every day
    # - cron: '15 4 * * *' # Daily at 9:45 AM IST
    - cron: '10 6 * * *'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag, e.g. @Naukri (empty runs all)'
        required: false
        default: '@Naukri'
        type: string

permissions:
  contents: read

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLAYWRIGHT_HTML_OPEN: 'never'

jobs:
  execute-tests:
    name: Execute Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Get Playwright Version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-msedge-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Microsoft Edge Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install msedge

      - name: Install OS Dependencies
        run: npx playwright install-deps msedge

      - name: Run Playwright Tests
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          TEST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p logs

          TEST_TAG="${TEST_TAG:-@Naukri}"
          args=(--project=Edge --workers=1 --reporter=line,html --grep "$TEST_TAG")

          npx playwright test "${args[@]}" 2>&1 | tee logs/test-run.log

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            logs/
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: warn

  publish-report:
    name: Upload Playwright Report
    needs: execute-tests
    runs-on: ubuntu-latest
    steps:
      # Download artifact generated from previous job
      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: test-artifacts/
