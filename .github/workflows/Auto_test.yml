name: Playwright Tests

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 9:30 AM IST

  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag, e.g. @Naukri (empty runs all)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLAYWRIGHT_HTML_OPEN: 'never'

jobs:
  execute-tests:
    name: Execute Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Microsoft Edge
        run: npx playwright install --with-deps msedge

      - name: Run Playwright Tests
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          TEST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p logs

          args=(--project=Edge --workers=1 --reporter=line,html)

          if [[ -n "$TEST_TAG" ]]; then
            args+=(--grep "$TEST_TAG")
          fi

          npx playwright test "${args[@]}" 2>&1 | tee logs/test-run.log

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore