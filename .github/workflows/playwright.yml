# Workflow Name
name: Playwright Tests

# Trigger Conditions
on:
  schedule:
    - cron: '30 2 * * *' # Daily at 8:00 AM IST

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to run tests for'
        required: false
        default: ''

# Required permissions
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  execute-tests:
    name: Execute Playwright Tests
    timeout-minutes: 60

    runs-on: ubuntu-latest

    # Playwright official image already contains browsers
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Run Playwright Tests
      - name: Run Playwright Tests
        run: |
          mkdir -p logs

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            npx playwright test --grep "${{ github.event.inputs.tag }}" 2>&1 | tee logs/test-run.log
          else
            npx playwright test 2>&1 | tee logs/test-run.log
          fi

      # Upload Logs
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 30

      # Upload Playwright Report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Upload Test Results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  publish-report:
    name: Upload Playwright Report
    needs: execute-tests
    runs-on: ubuntu-latest
    steps:
      # Download artifact generated from previous job
      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Re-upload artifact (optional separate job)
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-final
          path: playwright-report/
          retention-days: 30