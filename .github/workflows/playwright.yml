# Workflow Name
name: Playwright Tests

# Trigger Conditions
on:
  schedule:
    - cron: '30 2 * * *'  # Daily at 8:00 AM IST
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to run tests for'
        required: false
        default: ''

# Jobs Definition
jobs:
  # Job Configuration
  test:
    timeout-minutes: 60 # Maximum time for the job to run 
    runs-on: ubuntu-latest # Use the latest version of Ubuntu Linux to execute the job.

    # Steps in the Job
    steps:
      - uses: actions/checkout@v6 # This step checks out the source code from the repo so it can be used by the workflow.
      - uses: actions/setup-node@v6 # Sets up the latest LTS version of Node.js.
        with:
          node-version: lts/*
      - name: Install dependencies # Installs your project's Node.js dependencies using a clean install (npm ci is faster and more reliable than npm install for CI/CD).
        run: npm ci

      - name: Cache Playwright Browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps # Downloads the required browsers and dependencies for Playwright.
      - name: Run Playwright tests
        run: |
          mkdir -p logs
          if [ -n "${{ inputs.tag }}" ]; then
            npx playwright test --tag ${{ inputs.tag }} 2>&1 | tee logs/test-run.log
          else
            npx playwright test 2>&1 | tee logs/test-run.log
          fi

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: logs/
          retention-days: 30

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Test Results
          path: test-results/junit-results.xml
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@v6 # Upload Playwright Report
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
